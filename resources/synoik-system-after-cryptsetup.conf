# Install as /etc/systemd/system/synoik-system.service.d/initrd-splash.conf where the initramfs
# has the synoik splash. It asks for the real root's disk passwords until the outer takes it over,
# and a prompt up at that handover would die with its connection: the disks are unlocked first
# (docs/fork/boot-splash.md §7.2).
[Unit]
After=cryptsetup.target

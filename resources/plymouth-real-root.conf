# Install as /etc/systemd/system/{plymouth-start,plymouth-quit-wait}.service.d/synoik.conf.
#
# After switch_root the system compositor is plymouth (docs/fork/boot-splash.md §2.2): a second
# plymouthd would race it for the card, and `plymouth --wait` would wait on the compositor's
# socket, which stays open, holding multi-user.target forever. Both still run in the initramfs.
[Unit]
ConditionPathExists=/etc/initrd-release

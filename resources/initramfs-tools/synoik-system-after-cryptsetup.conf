# Install as /etc/systemd/system/synoik-system.service.d/initramfs-tools.conf where the initramfs
# is initramfs-tools'. Its splash asks for the real root's disk passwords until the outer takes it
# over, and a prompt up at that handover would die with its connection: the disks are unlocked
# first (docs/fork/boot-splash.md §7.2, §7.6).
[Unit]
After=cryptsetup.target

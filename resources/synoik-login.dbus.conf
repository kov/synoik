<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Install as /usr/share/dbus-1/system.d/synoik-login.conf.

     synoik-login answers on GDM's name, so the same clients work against either
     (docs/fork/greeter.md §2.1). Only root may own it; anyone may ask the Manager, which checks
     each caller itself (§2.2). -->
<busconfig>
  <policy user="root">
    <allow own="org.gnome.DisplayManager"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.gnome.DisplayManager"
           send_interface="org.gnome.DisplayManager.Manager"/>
    <allow send_destination="org.gnome.DisplayManager"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.gnome.DisplayManager"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>

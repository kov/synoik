     OURS, not bundled (see battery-bolt-symbolic.svg for why this directory is
     no longer uniformly gnome-shell's). A mains plug, overlaid on the battery
     body for "plugged in but not charging" — the state a Mac sits in once it
     stops at ~80%, and the one a full battery sits in on AC. Adwaita expresses
     this as battery-level-*-plugged-in-symbolic, whole batteries with the plug
     baked in; we draw our own body, so we need the plug alone.

     Deliberately chunky: it is drawn at ~12 logical px inside the battery, and
     prongs thinner than this vanish. See docs/fork/battery-indicator-design.md. -->

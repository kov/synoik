# Install as /etc/systemd/system/plymouth-reboot.service.d/synoik.conf.
#
# The system compositor is plymouth to the end (docs/fork/boot-splash.md §2.2): rather than a
# plymouthd of its own, which could not draw anyway, this only tells it the mode. plymouth gives
# the mode to a daemon only as its `--mode=` argument, never over the protocol.
[Service]
Type=oneshot
ExecStart=
ExecStart=-/usr/bin/plymouth change-mode --reboot
ExecStartPost=

[workspace]
members = [
    "synoik-config",
    "synoik-ipc",
    "synoik-vk",
]

[workspace.package]
version = "26.4.0"
description = "A GNOME-behaviors Wayland desktop, written in Rust"
authors = ["Gustavo Noronha Silva <gustavo@noronha.dev.br>"]
license = "GPL-3.0-only"
edition = "2021"
# The floor our dependency tree actually imposes: glib/gio 0.22 want 1.92, and synoik-vk has
# declared 1.92 on its own since it was written. Inherited from niri as 1.85, which no longer
# resolved — keep this honest, the `msrv` CI job builds against exactly this number.
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1.0.102"
bitflags = "2.11.1"
clap = { version = "4.6.1", features = ["derive"] }
insta = "1.47.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = { version = "0.1.44", features = ["max_level_trace", "release_max_level_debug"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracy-client = { version = "0.18.4", default-features = false }

[workspace.dependencies.smithay]
# Patched fork (branch `synoik` off upstream rev ff5fa7df392cecfba049ffed55cdaa4e98a8e7ef):
# para-virt cursor-plane hotspot support (DRM_CLIENT_CAP_CURSOR_PLANE_HOTSPOT + HOTSPOT_X/Y)
# so the virtio-gpu host stops drawing its own pointer alongside ours, plus the compositor-side
# text-input and rect-rounding fixes. Working on smithay itself means editing a local clone and
# adding `paths = ["../smithay"]` to `.cargo/config.toml` — do NOT flip this back to a path dep,
# it is what broke every CI job when the repo went public.
git = "https://github.com/kov/smithay.git"
branch = "synoik"
default-features = false

[workspace.dependencies.smithay-drm-extras]
git = "https://github.com/kov/smithay.git"
branch = "synoik"

[package]
name = "synoik"
version.workspace = true
description.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

readme = "README.md"
keywords = ["wayland", "compositor", "tiling", "smithay", "wm"]

[dependencies]
accesskit = "0.24"
accesskit_unix = "0.22"
anyhow.workspace = true
arrayvec = "0.7.6"
ash = "0.38.0"
async-channel = "2.5.0"
async-io = "2.6.0"
atomic = "0.6.1"
bitflags.workspace = true
bytemuck = { version = "1.25.0", features = ["derive"] }
calloop = { version = "0.14.4", features = ["executor", "futures-io", "signals"] }
clap = { workspace = true, features = ["string"] }
clap_complete = "4.6.2"
clap_complete_nushell = "4.6.0"
directories = "6.0.0"
drm-ffi = "0.9.1"
fastrand = "2.4.1"
# Freedesktop icon-theme resolution (inheritance + size dirs) for full-color app
# icons in `render_helpers::icon`; we keep our own resvg/image decode + cache.
freedesktop-icons = "0.4.0"
futures-util = { version = "0.3.32", default-features = false, features = ["std", "io"] }
gio = "0.22.8"
# The Unix-only Gio bindings (GDesktopAppInfo lives here since gtk-rs-core 0.22,
# not in `gio`); backs the app catalog/search in `app_system`. `v2_58` is required
# because the binding for `DesktopAppInfo::search` (the relevance-grouped app
# search GNOME uses) lives in a module gated behind that feature (gio-unix
# `lib.rs`), even though the underlying `g_desktop_app_info_search` symbol is older.
gio-unix = { version = "0.22.8", features = ["v2_58"] }
git-version = "0.3.9"
glam = "0.32.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
input = { version = "0.10.0", features = ["libinput_1_21"] }
jxl-oxide = { version = "0.12.6", features = ["image"] }
keyframe = { version = "1.1.1", default-features = false }
libc = "0.2.185"
libdisplay-info = "0.3.0"
log = { version = "0.4.29", features = ["max_level_trace", "release_max_level_debug"] }
synoik-config = { version = "26.4.0", path = "synoik-config" }
synoik-ipc = { version = "26.4.0", path = "synoik-ipc", features = ["clap"] }
synoik-vk = { version = "0.0.0", path = "synoik-vk" }
ordered-float = "5.3.0"
roxmltree = "0.21.1"
# v0_3_34 for `pw_stream_is_driving`/`pw_stream_trigger_process`, which a DRIVER stream must call
# to get its queued frames scheduled — see `Cast::trigger_if_driving`.
pipewire = { version = "0.9.2", optional = true, features = ["v0_3_34"] }
png = "0.18.1"
profiling = "1.0.17"
resvg = "0.47.0"
sd-notify = "0.5.0"
serde.workspace = true
serde_json.workspace = true
smithay-drm-extras.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
tracy-client.workspace = true
# Direct libudev access for the `backlight` subsystem: smithay's UdevBackend is DRM-only, and
# mutter watches {drm, backlight} (`meta-udev.c:357-367`). Already in the tree via smithay.
udev = "0.9.3"
wayland-backend = "0.3.15"
wayland-scanner = "0.31.10"
wayland-server = "0.31.13"
xcursor = "0.3.10"
# `p2p`: gdm hands out a peer-to-peer address for the reauthentication channel
# (`gdm-client.c:373` connects with no MESSAGE_BUS_CONNECTION flag), so the unlock
# dialog needs a non-bus connection. See `dbus::gdm`.
zbus = { version = "5.13.2", features = ["p2p"] }
jiff = "0.2"
tzf-rs = "1.3"
unicode-segmentation = "1.13.3"
uuid = { version = "1.24.0", features = ["v4"] }

[dependencies.smithay]
workspace = true
features = [
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "desktop",
    # The compositor renders through the owned Vulkan renderer (synoik-vk), so smithay's GL renderer
    # and the EGL backend under it are not built. `renderer_pixman` stays: it is the CPU oracle the
    # Vulkan render tests compare against.
    "renderer_pixman",
    "use_system_lib",
    "wayland_frontend",
]

[dev-dependencies]
approx = "0.5.1"
calloop-wayland-source = "0.4.1"
insta.workspace = true
matroska-demuxer = "0.8.0"
proptest = "1.11.0"
proptest-derive = { version = "0.8.0", features = ["boxed_union"] }
rayon = "1.12.0"
wayland-client = "0.31.14"
# The test client speaks these protocols through `smithay::reexports`, which only exposes their
# `client` modules if something in the graph enables the feature. That used to be `winit` (via
# smithay's `backend_winit`) purely by Cargo feature unification — an accident that broke the moment
# the winit backend was deleted. Ask for it directly instead.
wayland-protocols = { version = "0.32.12", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
xshell = "0.2.7"

[build-dependencies]
pkg-config = "0.3.33"

[features]
default = ["systemd", "xdp-gnome-screencast", "audio"]
# D-Bus is NOT a feature: a GNOME desktop is a D-Bus desktop. Nearly every behavior we port --
# the session manager, the shell interfaces, notifications, polkit, the a11y tree, gsd -- is a bus
# conversation, so a build without zbus is not a smaller synoik, it is a different program. It had
# rotted unbuilt for that reason before the gate came out.
# Enables systemd integration (global environment, apps in transient scopes).
systemd = []
# Enables screencasting support through xdg-desktop-portal-gnome.
xdp-gnome-screencast = ["pipewire"]
# Enables the audio (volume/mute) indicator + quick-settings slider via PipeWire.
audio = ["pipewire"]
# Enables the Tracy profiler instrumentation.
# No `smithay/tracy_gpu_profiling`: it instruments smithay's *GLES* renderer, which we deleted, and
# it enables `renderer_gl` → `backend_egl`. That flips smithay's blanket `ImportAll` to the variant
# requiring `ImportEgl` (renderer/mod.rs:692-697), which `VulkanRenderer` deliberately does not
# implement — there is no EGL in this build — so the feature simply did not compile. Our own GPU
# timings come from Vulkan timestamp queries, not smithay's.
profile-with-tracy = ["profiling/profile-with-tracy", "tracy-client/default"]
# Enables the on-demand Tracy profiler instrumentation.
profile-with-tracy-ondemand = ["profile-with-tracy", "tracy-client/ondemand", "tracy-client/manual-lifetime"]
# Enables Tracy allocation profiling.
profile-with-tracy-allocations = ["profile-with-tracy"]
# Enables dinit integration (global environment).
dinit = []
# Test-only: run the checks that measure *shaped text* — calendar, OSD, app-grid and overview tile
# geometry compared against the live shell. They assert real pixel sizes, so they only mean anything
# on the reference font stack (Fedora, Adwaita Sans); anywhere else they report the runner's fonts
# as a layout bug. Gated as a feature rather than a list of test names in CI so that adding an
# eighth such test cannot silently leave it unrun. The fedora job turns it on.
reference-env = []

[lints.clippy]
new_without_default = "allow"
collapsible_match = "allow"

[profile.release]
# Full DWARF (was "line-tables-only") so a release binary is debuggable — locals in
# the debugger, richer profiler/crash symbolication. Costs link time + binary size;
# dial back to "line-tables-only" if that bites.
debug = true
overflow-checks = true
lto = "thin"

# Dev builds are optimized, ours and our dependencies' alike. The dev binary is what the
# gsrs seat runs, so anything slow here is slow in the session — and the three settings
# below are what it took to make the stock 4K JPEG-XL wallpaper decode in 0.28s instead of
# 2.42s. Each was measured on 2026-07-26; none is folklore.
#
# Debugging that genuinely needs opt-level 0 can drop it here temporarily (Gustavo,
# 2026-07-26: no session so far has). Note it would take the wallpaper stall back with it.
[profile.dev]
# 2.42s -> 0.28s, and the dev loop did NOT get slower: a touch-rebuild of the synoik crate
# went 6.1s -> 4.5s and `cargo test --workspace` stayed at ~17s (rustc emits far less code
# for the linker to chew at -O3 than at -O0). The one-time full rebuild is ~50s.
#
# Why this matters more than the dependency override below: a dependency's *generic* code
# is code-generated in whichever crate instantiates it, at THAT crate's optimization level.
# `image::DynamicImage::from_decoder` and `jxl_oxide::integration::JxlDecoder<R>` are
# generic, so with our crates at opt-level 0 the decoder's hot loops were built unoptimized
# no matter what the dependencies were compiled with. This line is what reaches them.
opt-level = 3

[profile.dev.package."*"]
# Heavy decoders and rasterizers (jxl-oxide, resvg, image, ash/Vulkan) are painfully slow
# unoptimized, and only the first build after a dep change pays for this.
opt-level = 3
# `opt-level` alone still leaves dependencies with the dev profile's debug assertions and
# overflow checks, which a decoder pays on every arithmetic op: 2.42s -> 1.62s on that same
# wallpaper. Release turns both off anyway, so this only makes dev agree with what we ship.
debug-assertions = false
overflow-checks = false

# ...except the log crates, which read `debug_assertions` to decide whether they are a *release*
# build. `tracing`'s STATIC_MAX_LEVEL is `cfg!(all(not(debug_assertions), feature =
# "release_max_level_debug"))` (`tracing/src/level_filters.rs:68-78`), and both crates carry
# `release_max_level_debug` above, so the override two lines up made them strip every `trace!`
# from our *dev* builds — statically, at the call site. The symptom is silent and expensive:
# `RUST_LOG=...=trace` is accepted, the filter is installed, the process has the env var, and not
# one TRACE line is ever emitted, because the call sites were compiled away. That cost a live seat
# relog to discover while diagnosing the screencast negotiation. These two crates are not the hot
# decoders the override exists for, so exempting them is free.
[profile.dev.package.tracing]
debug-assertions = true

[profile.dev.package.log]
debug-assertions = true

[package.metadata.generate-rpm]
version = "26.04"
assets = [
    { source = "target/release/synoik", dest = "/usr/bin/", mode = "755" },
    { source = "resources/synoik-session", dest = "/usr/bin/", mode = "755" },
    { source = "resources/synoik.desktop", dest = "/usr/share/wayland-sessions/", mode = "644" },
    { source = "resources/synoik-portals.conf", dest = "/usr/share/xdg-desktop-portal/", mode = "644" },
    { source = "resources/synoik.service", dest = "/usr/lib/systemd/user/", mode = "644" },
    { source = "resources/synoik-shutdown.target", dest = "/usr/lib/systemd/user/", mode = "644" },
]
[package.metadata.generate-rpm.requires]
alacritty = "*"
fuzzel = "*"

[package.metadata.deb]
depends = "alacritty, fuzzel"
assets = [
    ["target/release/synoik", "usr/bin/", "755"],
    ["resources/synoik-session", "usr/bin/", "755"],
    ["resources/synoik.desktop", "/usr/share/wayland-sessions/", "644"],
    ["resources/synoik-portals.conf", "/usr/share/xdg-desktop-portal/", "644"],
    ["resources/synoik.service", "/usr/lib/systemd/user/", "644"],
    ["resources/synoik-shutdown.target", "/usr/lib/systemd/user/", "644"],
]

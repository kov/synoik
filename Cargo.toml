[workspace]
members = [
    "niri-config",
    "niri-ipc",
    "niri-vk",
]

[workspace.package]
version = "26.4.0"
description = "A scrollable-tiling Wayland compositor"
authors = ["Ivan Molodetskikh <yalterz@gmail.com>"]
license = "GPL-3.0-or-later"
edition = "2021"
repository = "https://github.com/niri-wm/niri"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.102"
bitflags = "2.11.1"
clap = { version = "4.6.1", features = ["derive"] }
insta = "1.47.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = { version = "0.1.44", features = ["max_level_trace", "release_max_level_debug"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracy-client = { version = "0.18.4", default-features = false }

[workspace.dependencies.smithay]
# version = "0.4.1"
# Local patched fork (branch gsrs-cursor-hotspot off upstream rev
# ff5fa7df392cecfba049ffed55cdaa4e98a8e7ef): adds para-virt cursor-plane
# hotspot support (DRM_CLIENT_CAP_CURSOR_PLANE_HOTSPOT + HOTSPOT_X/Y) so the
# virtio-gpu host stops drawing its own pointer alongside ours.
path = "../smithay"
default-features = false

[workspace.dependencies.smithay-drm-extras]
# version = "0.1.0"
path = "../smithay/smithay-drm-extras"

[package]
name = "niri"
version.workspace = true
description.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

readme = "README.md"
keywords = ["wayland", "compositor", "tiling", "smithay", "wm"]

[dependencies]
accesskit = { version = "0.24", optional = true }
accesskit_unix = { version = "0.22", optional = true }
anyhow.workspace = true
arrayvec = "0.7.6"
ash = "0.38.0"
async-channel = "2.5.0"
async-io = { version = "2.6.0", optional = true }
atomic = "0.6.1"
bitflags.workspace = true
bytemuck = { version = "1.25.0", features = ["derive"] }
calloop = { version = "0.14.4", features = ["executor", "futures-io", "signals"] }
clap = { workspace = true, features = ["string"] }
clap_complete = "4.6.2"
clap_complete_nushell = "4.6.0"
directories = "6.0.0"
drm-ffi = "0.9.1"
fastrand = "2.4.1"
futures-util = { version = "0.3.32", default-features = false, features = ["std", "io"] }
gio = "0.22.8"
# The Unix-only Gio bindings (GDesktopAppInfo lives here since gtk-rs-core 0.22,
# not in `gio`); backs the app catalog/search in `app_system`. `v2_58` is required
# because the binding for `DesktopAppInfo::search` (the relevance-grouped app
# search GNOME uses) lives in a module gated behind that feature (gio-unix
# `lib.rs`), even though the underlying `g_desktop_app_info_search` symbol is older.
gio-unix = { version = "0.22.8", features = ["v2_58"] }
git-version = "0.3.9"
glam = "0.32.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
input = { version = "0.10.0", features = ["libinput_1_21"] }
jxl-oxide = { version = "0.12.6", features = ["image"] }
keyframe = { version = "1.1.1", default-features = false }
libc = "0.2.185"
libdisplay-info = "0.3.0"
log = { version = "0.4.29", features = ["max_level_trace", "release_max_level_debug"] }
niri-config = { version = "26.4.0", path = "niri-config" }
niri-ipc = { version = "26.4.0", path = "niri-ipc", features = ["clap"] }
niri-vk = { version = "0.0.0", path = "niri-vk" }
ordered-float = "5.3.0"
roxmltree = "0.21.1"
pipewire = { version = "0.9.2", optional = true, features = ["v0_3_33"] }
png = "0.18.1"
profiling = "1.0.17"
resvg = "0.47.0"
sd-notify = "0.5.0"
serde.workspace = true
serde_json.workspace = true
smithay-drm-extras.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
tracy-client.workspace = true
wayland-backend = "0.3.15"
wayland-scanner = "0.31.10"
wayland-server = "0.31.13"
xcursor = "0.3.10"
zbus = { version = "5.13.2", optional = true }
jiff = "0.2"
tzf-rs = "1.3"

[dependencies.smithay]
workspace = true
features = [
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "desktop",
    # The compositor renders through the owned Vulkan renderer (niri-vk), so smithay's GL renderer
    # and the EGL backend under it are not built. `renderer_pixman` stays: it is the CPU oracle the
    # Vulkan render tests compare against.
    "renderer_pixman",
    "use_system_lib",
    "wayland_frontend",
]

[dev-dependencies]
approx = "0.5.1"
calloop-wayland-source = "0.4.1"
insta.workspace = true
matroska-demuxer = "0.8.0"
proptest = "1.11.0"
proptest-derive = { version = "0.8.0", features = ["boxed_union"] }
rayon = "1.12.0"
wayland-client = "0.31.14"
# The test client speaks these protocols through `smithay::reexports`, which only exposes their
# `client` modules if something in the graph enables the feature. That used to be `winit` (via
# smithay's `backend_winit`) purely by Cargo feature unification — an accident that broke the moment
# the winit backend was deleted. Ask for it directly instead.
wayland-protocols = { version = "0.32.12", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
xshell = "0.2.7"

[build-dependencies]
pkg-config = "0.3.33"

[features]
default = ["dbus", "systemd", "xdp-gnome-screencast", "audio"]
# Enables D-Bus support (serve various freedesktop and GNOME interfaces, accessibility tree, power button handling).
dbus = ["dep:zbus", "dep:async-io", "dep:accesskit", "dep:accesskit_unix"]
# Enables systemd integration (global environment, apps in transient scopes).
systemd = ["dbus"]
# Enables screencasting support through xdg-desktop-portal-gnome.
xdp-gnome-screencast = ["dbus", "pipewire"]
# Enables the audio (volume/mute) indicator + quick-settings slider via PipeWire.
audio = ["pipewire"]
# Enables the Tracy profiler instrumentation.
profile-with-tracy = ["profiling/profile-with-tracy", "tracy-client/default", "smithay/tracy_gpu_profiling"]
# Enables the on-demand Tracy profiler instrumentation.
profile-with-tracy-ondemand = ["profile-with-tracy", "tracy-client/ondemand", "tracy-client/manual-lifetime"]
# Enables Tracy allocation profiling.
profile-with-tracy-allocations = ["profile-with-tracy"]
# Enables dinit integration (global environment).
dinit = []

[lints.clippy]
new_without_default = "allow"
collapsible_match = "allow"

[profile.release]
# Full DWARF (was "line-tables-only") so a release binary is debuggable — locals in
# the debugger, richer profiler/crash symbolication. Costs link time + binary size;
# dial back to "line-tables-only" if that bites.
debug = true
overflow-checks = true
lto = "thin"

[profile.release.package.niri-config]
# knuffel with chomsky generates a metric ton of debuginfo.
debug = false

[profile.dev.package."*"]
# Optimize all dependencies at opt-level 3 even in dev/test builds; our own crates
# stay at opt-level 0 for fast incremental rebuilds. Heavy decoders and rasterizers
# (the 4K JPEG-XL wallpaper decode, resvg, image, ash/Vulkan) are painfully slow
# unoptimized — this is the fix for the seconds-long wallpaper stall on the dev binary
# the gsrs seat runs. Only the first build after a dep change pays; the ~15s dev-loop
# rebuild of our own code is unaffected.
opt-level = 3

[package.metadata.generate-rpm]
version = "26.04"
assets = [
    { source = "target/release/niri", dest = "/usr/bin/", mode = "755" },
    { source = "resources/niri-session", dest = "/usr/bin/", mode = "755" },
    { source = "resources/niri.desktop", dest = "/usr/share/wayland-sessions/", mode = "644" },
    { source = "resources/niri-portals.conf", dest = "/usr/share/xdg-desktop-portal/", mode = "644" },
    { source = "resources/niri.service", dest = "/usr/lib/systemd/user/", mode = "644" },
    { source = "resources/niri-shutdown.target", dest = "/usr/lib/systemd/user/", mode = "644" },
]
[package.metadata.generate-rpm.requires]
alacritty = "*"
fuzzel = "*"

[package.metadata.deb]
depends = "alacritty, fuzzel"
assets = [
    ["target/release/niri", "usr/bin/", "755"],
    ["resources/niri-session", "usr/bin/", "755"],
    ["resources/niri.desktop", "/usr/share/wayland-sessions/", "644"],
    ["resources/niri-portals.conf", "/usr/share/xdg-desktop-portal/", "644"],
    ["resources/niri.service", "/usr/lib/systemd/user/", "644"],
    ["resources/niri-shutdown.target", "/usr/lib/systemd/user/", "644"],
]

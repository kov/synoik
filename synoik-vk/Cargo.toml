[package]
name = "synoik-vk"
version = "0.0.0"
edition = "2021"
# This crate is what first pushed the floor to 1.92 (its optional `pango-ref` rasterizer needs
# pango 0.22), but the workspace has since caught up, so inherit rather than restate — two numbers
# that must agree is one number too many.
rust-version.workspace = true
license = "GPL-3.0-only"
publish = false
description = "Owned Vulkan (ash) render primitives for the compositor's Vulkan renderer, plus a headless bring-up/CI binary (see docs/fork render plan)."

[dependencies]
anyhow.workspace = true
ash = "0.38.0"
cosmic-text = "0.19.0"
# Explicit-sync spike (sync_spike.rs): drm_syncobj ioctls + raw sync_file/eventfd/poll. drm-ffi
# 0.9 dedupes with the version Smithay already pulls into the workspace.
drm-ffi = "0.9.1"
etagere = "0.3.0"
gbm = "0.18.0"
libc = "0.2"
png = "0.18.1"
# COLRv1 colour glyphs (`colr.rs`): skrifa walks the paint graph swash cannot read (it does
# COLR v0 only), tiny-skia draws it. Both are MIT/Apache-2.0 or BSD-3, so GPL-3.0-only is fine.
skrifa = "0.46.2"
swash = "0.2"
tiny-skia = "0.12.0"

# The demo binary's pango/cairo reference rasterizer (see `pango-ref` feature). Optional so the
# compositor build (which depends on this crate as a library) never compiles cairo/pango — the swash
# glyph atlas is the shipping text path; pango is only a dev-time crispness oracle.
cairo-rs = { version = "0.22.0", optional = true }
pango = { version = "0.22.8", optional = true }
pangocairo = { version = "0.22.8", optional = true }

[features]
# Stack a pango/cairo reference under our swash atlas in the `text.png` demo artifact for a 1x
# crispness compare: `cargo run -p synoik-vk --features pango-ref`. Off by default.
pango-ref = ["dep:cairo-rs", "dep:pango", "dep:pangocairo"]
# Test-only: run the checks that measure *shaped text* against the live shell's own numbers. They
# assert real pixel sizes, so they only mean anything on the reference font stack (Fedora, Adwaita
# Sans); on a runner with some fallback face they report its metrics as a bug. The root crate's
# `reference-env` turns this on with it, so the fedora job enables both at once.
reference-env = []

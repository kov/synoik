name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # Monthly

env:
  # `libegl1-mesa-dev` is deliberately absent: the renderer is our own Vulkan one (synoik-vk,
  # via `ash`, which loads the loader at runtime), and smithay's GL renderer and EGL backend
  # are not in our feature set. `libpixman-1-dev` is for smithay's `renderer_pixman`, the CPU
  # oracle the Vulkan render tests compare against; pango/cairo are for synoik-vk's text. glslang
  # supplies `glslangValidator`, which synoik-vk/build.rs shells out to to compile the shaders to
  # SPIR-V — a build dependency, not a runtime one, and a hard failure without it.
  # gsettings-desktop-schemas and gnome-settings-daemon are TEST dependencies, not build ones: the
  # conformance corpus asserts our defaults against GNOME's own schema defaults, so without the
  # schemas installed those tests cannot make their assertion. They fail rather than skip — a
  # skipped check is indistinguishable from a passing one in a green run.
  # ffmpeg is the other test dependency of that kind: the native recorder streams frames to an
  # `ffmpeg` subprocess (src/recording/encoder.rs), so the recording tests skip themselves without
  # it — and a skipped recorder is a recorder nothing checks.
  # The fedora container ships only the C locale, but the app grid sorts names through
  # `g_utf8_collate_key`/`strcoll`, so glibc-langpack-en supplies the collation the order tests
  # assert on (see `pin_collation` in src/tests/fixture.rs). The ubuntu runners already have it.
  # lcms2/fontconfig/seccomp are glycin's, and glycin-loaders/bubblewrap/gnome-backgrounds are
  # what the wallpaper decode tests need: the picture is decoded by the sandboxed loader
  # processes mutter uses (`src/wallpaper.rs`), so those two are runtime dependencies of synoik,
  # not build ones. The loaders must expose a `2+` API directory — 26.04 ships 2.1.1 and Fedora
  # 44 ships 2.1.5, while 24.04 was still on 1.0.1, which is part of why the runners moved.
  DEPS_APT: curl gcc clang glslang-tools libudev-dev libgbm-dev libxkbcommon-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libglib2.0-dev libpango1.0-dev libcairo2-dev libpixman-1-dev libdisplay-info-dev liblcms2-dev libfontconfig-dev libseccomp-dev gsettings-desktop-schemas gnome-settings-daemon-common gnome-backgrounds glycin-loaders bubblewrap mesa-vulkan-drivers ffmpeg
  DEPS_DNF: cargo gcc clang glslang libudev-devel libgbm-devel libxkbcommon-devel wayland-devel libinput-devel dbus-devel systemd-devel libseat-devel pipewire-devel glib2-devel pango-devel cairo-gobject-devel pixman-devel libdisplay-info-devel lcms2-devel fontconfig-devel libseccomp-devel gsettings-desktop-schemas gnome-settings-daemon glibc-langpack-en ffmpeg-free glycin-loaders bubblewrap gnome-backgrounds
  # The `reference-env` tests measure shaped text, so the UI font stack is part of the fixture:
  # Adwaita Sans is what `font-name` resolves to at runtime (docs/fork/gnome-style-reference.md).
  FONTS_DNF: adwaita-sans-fonts adwaita-mono-fonts abattis-cantarell-fonts

jobs:
  test:
    strategy:
      fail-fast: false

    name: test
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ env.DEPS_APT }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build tests
        run: cargo test --no-run --workspace

      # The conformance corpus is headless and needs no renderer; the Vulkan render tests skip
      # themselves when the runner has no device.
      - name: Test
        run: cargo test --workspace -- --nocapture

  build:
    strategy:
      fail-fast: false

    name: check feature combinations
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ env.DEPS_APT }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # A full build, not a `check`, because this combination has a downstream consumer: ghost's
      # test suite provisions synoik by cloning a pinned rev and building it `--no-default-features`
      # (no systemd, no xdp-gnome-screencast, no audio), which is what keeps the pipewire headers off
      # a ghost developer's machine. `check` would not catch a link failure, and a link failure is
      # exactly what a feature-gated native dependency produces. The other combinations below stay
      # `check`: they exist to catch compile errors in gated code, and nothing links them.
      - name: Build (no default features)
        run: cargo build --no-default-features

      - name: Check (just systemd)
        run: cargo check --no-default-features --features systemd

      - name: Check (just dinit)
        run: cargo check --no-default-features --features dinit

      - name: Check (just xdp-gnome-screencast)
        run: cargo check --no-default-features --features xdp-gnome-screencast

      - name: Check (just audio)
        run: cargo check --no-default-features --features audio

      - name: Check
        run: cargo check

      - name: Build (with profiling)
        run: cargo build --features profile-with-tracy

  # Runs the randomized (proptest) and slow tests for far longer than the normal `test` job.
  # Expensive, so it stays off feature-branch pushes and PRs: main, the monthly schedule, and
  # manual dispatch only.
  randomized-tests:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')

    strategy:
      fail-fast: false

    name: randomized and slow tests
    runs-on: ubuntu-26.04

    env:
      RUST_BACKTRACE: 1
      RUN_SLOW_TESTS: 1
      PROPTEST_CASES: 200000
      PROPTEST_MAX_LOCAL_REJECTS: 200000
      PROPTEST_MAX_GLOBAL_REJECTS: 200000
      PROPTEST_MAX_SHRINK_ITERS: 200000

    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ env.DEPS_APT }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build tests
        run: cargo test --no-run --workspace --release

      - name: Test
        run: cargo test --workspace --release

  # Keep in sync with `rust-version` in the workspace Cargo.toml.
  msrv:
    strategy:
      fail-fast: false

    name: msrv
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ env.DEPS_APT }}

      # Must match `rust-version` in the workspace Cargo.toml — that is the number this job exists
      # to prove, and the two drifting apart is how it came to pin a toolchain cargo would refuse.
      - uses: dtolnay/rust-toolchain@1.92.0

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --workspace --all-targets

  # Same invocation as .githooks/pre-commit, so a green hook means a green job.
  clippy:
    strategy:
      fail-fast: false

    name: clippy
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ env.DEPS_APT }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rustfmt:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false

      # rustfmt.toml uses unstable options (imports_granularity, group_imports), so nightly.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Run rustfmt
        run: cargo fmt --all -- --check

  # Fedora is what the development VM and the test seat run, so this is the distro build that
  # matters; it also checks we still build with the distro's Rust rather than rustup's.
  # The reference-environment job: Fedora 44 is what the dev box and the gnome-shell/mutter 50.3
  # reference checkouts run, so this is the only runner where measured text geometry means
  # anything. It is therefore the one that turns on `reference-env` (see Cargo.toml).
  fedora:
    runs-on: ubuntu-26.04
    # The wallpaper decode tests skip themselves here: glycin decodes inside `bwrap`, and an
    # unprivileged container cannot create the user namespace bwrap needs. `--privileged` would
    # let them run, but the ubuntu runner decodes for real, so this job does not need the
    # privilege to keep that covered.
    container: fedora:44

    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Install dependencies
        run: |
          dnf update -y
          dnf install -y ${{ env.DEPS_DNF }} ${{ env.FONTS_DNF }}

      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features reference-env

  publish-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          show-progress: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate rustdoc documentation
        run: cargo doc --no-deps -p synoik-ipc

      - run: mkdir -p publish/synoik_ipc
      - run: cp -r ./target/doc/* ./publish/

      - name: Deploy documentation
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          force_orphan: true

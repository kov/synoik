[package]
name = "synoik-splash"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

description = "The synoik boot splash: plymouthd's protocol, the splash layout, and the initramfs splash program."

[[bin]]
name = "synoik-splash"
path = "src/main.rs"

[dependencies]
